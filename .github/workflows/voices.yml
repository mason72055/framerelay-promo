name: Build voice samples (posts nothing)
on:
  push:
    paths: [".github/voice-request.txt"]
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build samples
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python3 voice_samples.py
      - name: Save samples
        run: |
          git config user.name framerelay-promo-bot; git config user.email bot@users.noreply.github.com
          git add previews/voices.mp3; git commit -qm "voice samples"; git pull -q --rebase; git push -q
