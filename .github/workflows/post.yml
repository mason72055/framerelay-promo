name: Schedule next promo video
on:
  schedule:
    - cron: "7 16 * * 1,2,4,5"   # about 10:07 AM Central, Mon/Tue/Thu/Fri
  workflow_dispatch:
    inputs:
      video:
        description: "Optional: video id to run (blank = next unposted)"
        default: "02-three-moments"
        required: false
      preview:
        description: "Type yes to build a voiced preview only (posts nothing)"
        default: "no"
        required: false
      confirm:
        description: "Leave EMPTY. Type post only if you really want this to post right now"
        default: ""
        required: false
      check_only:
        description: "Type yes to only list the channels (posts nothing)"
        default: "no"
        required: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core
      - run: pip install -q requests pillow
      - name: Schedule via Buffer (does nothing without BUFFER_API_KEY)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY_FRAMERELAY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VIDEO: ${{ inputs.video }}
          CHECK_ONLY: ${{ inputs.check_only }}
          PREVIEW: ${{ inputs.preview }}
          CONFIRM_POST: ${{ inputs.confirm }}
        run: python post.py
      - name: Save which videos were posted
        run: |
          if [ -n "$(git status --porcelain posted.json 2>/dev/null)" ]; then
            git config user.name framerelay-promo-bot; git config user.email bot@users.noreply.github.com
            git add posted.json; git commit -qm "posted"; git push -q
          fi
